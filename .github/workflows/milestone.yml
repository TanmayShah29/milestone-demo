name: milestone

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  MILESTONE_API: https://milestone-ai-escrow.onrender.com

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.c.outputs.matrix }}
      hash: ${{ steps.c.outputs.hash }}
    steps:
      # The base branch's helper script, never the PR's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: c
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/milestone/contract.mjs matrix

  acceptance:
    needs: contract
    if: needs.contract.outputs.matrix != '[]'
    # The check-run name carries the full contract hash this job verified and ran, so Milestone can tell
    # a run of the signed contract from a run of some other contract on the same commit.
    name: acceptance (${{ matrix.criterion }}) terms ${{ needs.contract.outputs.hash }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        criterion: ${{ fromJSON(needs.contract.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          sparse-checkout: .github/milestone
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: t
        env:
          MILESTONE_TERMS: ${{ needs.contract.outputs.hash }}
        run: node .base/.github/milestone/contract.mjs write "${{ matrix.criterion }}"
      # Not `node --test`: it reports success when the code under test exits the process early.
      # The base branch's harness checks that every signed test actually ran and passed.
      - run: node .base/.github/milestone/run-tests.mjs "${{ steps.t.outputs.path }}"
